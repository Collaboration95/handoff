[project]
name = "handoff-finance"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langfuse>=3",
  "livekit-agents[openai]~=1.8",
  "openai>=2.54,<3",
  "pydantic>=2",
  "python-dotenv>=1",
  "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
